<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | RAG Matrix</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f9fafb;
      color: #111827;
      text-align: center;
    }

    .card {
      padding: 2rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 400px;
    }

    h1 {
      color: #6366f1;
      margin-bottom: 0.5rem;
    }

    p {
      color: #4b5563;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try reloading the app.</p>
  </div>
</body>

</html>
