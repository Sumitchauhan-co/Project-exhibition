<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Matrix | Automated RAG Evaluation Suite</title>
  <meta name="description"
    content="Automated evaluation matrix for Retrieval-Augmented Generation systems. Benchmark latency, context recall, and faithfulness across LLMs." />

  <!-- Favicon & PWA Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Web App Manifest -->
  <link rel="manifest" href="/site.webmanifest" />

  <!-- PWA Theme & Mobile Browser Controls -->
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />

  <!-- iOS PWA Enhancements -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RAG Matrix" />

  <!-- Windows Tile Meta -->
  <meta name="msapplication-TileColor" content="#4f46e5" />
  <meta name="msapplication-config" content="/browserconfig.xml" />

  <!-- Open Graph & Social Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="RAG Matrix | Automated RAG Evaluation Suite" />
  <meta property="og:description" content="Benchmark latency, context recall, and faithfulness across LLMs." />
  <meta property="og:image" content="/og-image.png" />

  <!-- Google Tag (gtag.js) with Dynamic Vite Environment Variable -->
  <script>
    const gaId = import.meta.env.VITE_GA_MEASUREMENT_ID;
    if (gaId) {
      const script = document.createElement('script');
      script.async = true;
      script.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
      document.head.appendChild(script);

      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied'
      });
      gtag('config', gaId);
    }
  </script>
</head>

<body
  class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
